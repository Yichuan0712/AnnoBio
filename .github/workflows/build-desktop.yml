name: Build desktop installers

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22'
  # Embedded Python version shared by both platforms (wide prebuilt-wheel coverage; avoid
  # bleeding-edge minor versions that some backend deps may not have wheels for yet).
  PYTHON_VERSION: '3.12.8'
  # macOS embedded Python: astral-sh/python-build-standalone "install_only" release tag.
  PBS_RELEASE_TAG: '20241206'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Fetch embeddable Python for Windows + install backend deps
        shell: pwsh
        run: ./scripts/prepare-python-embed-windows.ps1 -PythonVersion $env:PYTHON_VERSION

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      # The tag is the version: v1.2.0 builds 1.2.0 without a separate package.json bump.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Package + build NSIS installer
        working-directory: app
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/dist/*.exe
          if-no-files-found: error

  build-mac:
    # Apple Silicon only: GitHub retired the free Intel (x64) macOS runners (macos-13 is
    # gone, macos-14 is deprecated); Intel now requires paid/large-labeled runners. Modern
    # Macs are arm64, and arm64 can run x64 apps under Rosetta if ever needed, so building
    # just arm64 keeps this simple instead of paying for an x64 runner.
    runs-on: macos-15
    env:
      PBS_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Fetch relocatable CPython for macOS (arm64)
        run: |
          set -euo pipefail
          url="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE_TAG}/cpython-${PYTHON_VERSION}+${PBS_RELEASE_TAG}-${PBS_TARGET}-install_only.tar.gz"
          echo "Downloading $url"
          curl -fL "$url" -o /tmp/cpython.tar.gz
          rm -rf backend/python-embed
          mkdir -p backend/python-embed
          tar -xzf /tmp/cpython.tar.gz -C backend/python-embed --strip-components=1
          # Some install_only builds don't ship a plain `python` symlink; main.js expects one.
          if [ ! -e backend/python-embed/bin/python ]; then
            ln -sf python3 backend/python-embed/bin/python
          fi
          backend/python-embed/bin/python --version

      - name: Install backend Python dependencies into the embed
        # textgrad is deliberately not in requirements.txt (see its comment there) — installed
        # the same reduced-dependency way as backend/Dockerfile.
        run: |
          backend/python-embed/bin/python -m pip install --no-cache-dir -r backend/requirements.txt
          backend/python-embed/bin/python -m pip install --no-cache-dir --no-deps textgrad==0.1.8
          backend/python-embed/bin/python -m pip install --no-cache-dir platformdirs diskcache

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Package app (electron-forge)
        working-directory: app
        run: npm run package

      - name: Build dmg (electron-builder)
        working-directory: app
        run: npx electron-builder --mac --arm64 --pd out/app-darwin-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer-arm64
          path: app/dist/*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Published, not a draft, so releases/latest/download/<name> resolves right away. A tag
      # with a suffix (v1.2.0-beta.1) becomes a prerelease, which "latest" skips.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: AnnoBio ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/windows-installer/*.exe
            artifacts/mac-installer-arm64/*.dmg
