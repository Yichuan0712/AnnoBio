name: Build desktop installers

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '20'
  # Embedded Python version shared by both platforms (wide prebuilt-wheel coverage; avoid
  # bleeding-edge minor versions that some backend deps may not have wheels for yet).
  PYTHON_VERSION: '3.12.8'
  # macOS embedded Python: astral-sh/python-build-standalone "install_only" release tag.
  PBS_RELEASE_TAG: '20241206'

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # electron-builder's NSIS helper download/extraction (elevate.exe etc.) is flaky
      # under the default C:\Users\...\AppData\Local\Temp path on GH-hosted Windows
      # runners (ENOENT copying elevate.exe from cache) - relocating TEMP/TMP and the
      # electron-builder cache onto the workspace drive avoids it.
      TEMP: ${{ github.workspace }}\_temp
      TMP: ${{ github.workspace }}\_temp
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\_eb-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Fetch embeddable Python for Windows + install backend deps
        shell: pwsh
        run: ./scripts/prepare-python-embed-windows.ps1 -PythonVersion $env:PYTHON_VERSION

      - name: Prepare relocated temp/cache dirs + Defender exclusions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          New-Item -ItemType Directory -Force -Path $env:ELECTRON_BUILDER_CACHE | Out-Null
          Add-MpPreference -ExclusionPath $env:TEMP -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:ELECTRON_BUILDER_CACHE -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron-builder\Cache" -ErrorAction SilentlyContinue
          # None of the paths above cover the checked-out workspace, so npm-installed
          # binaries like 7zip-bin's win/x64/7za.exe (used by the NSIS target itself,
          # unlike the skippable elevate.exe) still get quarantined mid-build - exclude
          # the whole workspace too.
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Package + build NSIS installer
        working-directory: app
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/dist/*.exe
          if-no-files-found: error

  build-mac:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            pbs_target: aarch64-apple-darwin
          - os: macos-13
            arch: x64
            pbs_target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Fetch relocatable CPython for macOS (${{ matrix.arch }})
        run: |
          set -euo pipefail
          url="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE_TAG}/cpython-${PYTHON_VERSION}+${PBS_RELEASE_TAG}-${{ matrix.pbs_target }}-install_only.tar.gz"
          echo "Downloading $url"
          curl -fL "$url" -o /tmp/cpython.tar.gz
          rm -rf backend/python-embed
          mkdir -p backend/python-embed
          tar -xzf /tmp/cpython.tar.gz -C backend/python-embed --strip-components=1
          # Some install_only builds don't ship a plain `python` symlink; main.js expects one.
          if [ ! -e backend/python-embed/bin/python ]; then
            ln -sf python3 backend/python-embed/bin/python
          fi
          backend/python-embed/bin/python --version

      - name: Install backend Python dependencies into the embed
        run: backend/python-embed/bin/python -m pip install --no-cache-dir -r backend/requirements.txt

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Package app (electron-forge)
        working-directory: app
        run: npm run package

      # `hdiutil create` has been failing with a bare "Exit code: 1" and no usable
      # stderr (electron-builder passes -quiet) even after fixing the known
      # title-with-spaces and duplicate-arch bugs. Capture disk space and scan for
      # dangling symlinks in the packaged output (the bundled python-embed dir is a
      # prime suspect) before the build, so a failure has diagnostics to act on.
      - name: Diagnose packaged output before dmg build
        working-directory: app
        run: |
          echo "--- df -h ---"
          df -h
          echo "--- du -sh out/app-darwin-${{ matrix.arch }} ---"
          du -sh "out/app-darwin-${{ matrix.arch }}" || true
          echo "--- dangling symlinks under out/app-darwin-${{ matrix.arch }} ---"
          find "out/app-darwin-${{ matrix.arch }}" -type l ! -exec test -e {} \; -print || true

      - name: Build dmg (electron-builder)
        working-directory: app
        run: npx electron-builder --mac --${{ matrix.arch }} --pd out/app-darwin-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer-${{ matrix.arch }}
          path: app/dist/*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/windows-installer/*.exe
            artifacts/mac-installer-arm64/*.dmg
            artifacts/mac-installer-x64/*.dmg
