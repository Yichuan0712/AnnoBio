name: Build desktop installers

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '20'
  # Embedded Python version shared by both platforms (wide prebuilt-wheel coverage; avoid
  # bleeding-edge minor versions that some backend deps may not have wheels for yet).
  PYTHON_VERSION: '3.12.8'
  # macOS embedded Python: astral-sh/python-build-standalone "install_only" release tag.
  PBS_RELEASE_TAG: '20241206'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Fetch embeddable Python for Windows + install backend deps
        shell: pwsh
        run: ./scripts/prepare-python-embed-windows.ps1 -PythonVersion $env:PYTHON_VERSION

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Package + build NSIS installer
        working-directory: app
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/dist/*.exe
          if-no-files-found: error

  build-mac:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            pbs_target: aarch64-apple-darwin
          - os: macos-13
            arch: x64
            pbs_target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Fetch relocatable CPython for macOS (${{ matrix.arch }})
        run: |
          set -euo pipefail
          url="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE_TAG}/cpython-${PYTHON_VERSION}+${PBS_RELEASE_TAG}-${{ matrix.pbs_target }}-install_only.tar.gz"
          echo "Downloading $url"
          curl -fL "$url" -o /tmp/cpython.tar.gz
          rm -rf backend/python-embed
          tar -xzf /tmp/cpython.tar.gz -C backend
          mv backend/python -- backend/python-embed
          # Some install_only builds don't ship a plain `python` symlink; main.js expects one.
          if [ ! -e backend/python-embed/bin/python ]; then
            ln -sf python3 backend/python-embed/bin/python
          fi
          backend/python-embed/bin/python --version

      - name: Install backend Python dependencies into the embed
        run: backend/python-embed/bin/python -m pip install --no-cache-dir -r backend/requirements.txt

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Package app (electron-forge)
        working-directory: app
        run: npm run package

      - name: Build dmg (electron-builder)
        working-directory: app
        run: npx electron-builder --mac --${{ matrix.arch }} --pd out/app-darwin-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer-${{ matrix.arch }}
          path: app/dist/*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/windows-installer/*.exe
            artifacts/mac-installer-arm64/*.dmg
            artifacts/mac-installer-x64/*.dmg
