# Local dev stack for the Hub. The per-user backend image it spawns containers from isn't part
# of this file — build it once (and again whenever backend/ changes) with:
#   docker build -t prompt-studio-backend:latest backend/
# and build the frontend it serves with:
#   cd app && npx vite build --config vite.renderer.config.mjs
# before `docker compose up`. The Hub only *runs* those two build outputs; it doesn't build them.
#
# Mounting the host's Docker socket into the Hub container gives it the same control over the
# host as root would have — acceptable for a self-hosted, admin-run instance, not for a
# public-facing one (see the plan's Phase 3+ note: a scoped Docker API proxy would replace this
# before that).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - prompt-studio-net
    depends_on:
      - hub

  hub:
    build:
      context: hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PROMPT_STUDIO_SESSION_SECRET: ${PROMPT_STUDIO_SESSION_SECRET:?set a random secret, e.g. in a .env file — see hub/main.py}
      PROMPT_STUDIO_BACKEND_IMAGE: prompt-studio-backend:latest
      PROMPT_STUDIO_NETWORK: prompt-studio-net
      PROMPT_STUDIO_FRONTEND_DIST: /app/frontend-dist
      # Public domain this Hub is reachable at, e.g. https://studio.example.org — required for
      # OpenRouter OAuth login to work (see hub/containers.py); everything else works without it.
      PROMPT_STUDIO_PUBLIC_BASE_URL: ${PROMPT_STUDIO_PUBLIC_BASE_URL:-}
      PROMPT_STUDIO_IDLE_TIMEOUT_SEC: ${PROMPT_STUDIO_IDLE_TIMEOUT_SEC:-1800}
      # How many per-user backend containers (1GB RAM / 1 CPU each — see containers.py) this host
      # allows running at once before new web sessions get turned away and pointed at the desktop
      # app instead. Unset (the default) or "auto" sizes it from the host's RAM: (RAM − 2GB) ÷ 1GB,
      # e.g. 6 on an 8GB box. A number overrides that; "off" removes the cap.
      PROMPT_STUDIO_MAX_ACTIVE_CONTAINERS: ${PROMPT_STUDIO_MAX_ACTIVE_CONTAINERS:-}
      # Outbound mail for password-reset links (see hub/mailer.py) — an SES SMTP credential pair,
      # not a raw AWS access key/secret (those aren't interchangeable). Unset SMTP_PASSWORD just
      # logs the reset link to the Hub's own stdout instead of emailing it, so local dev works
      # without any of this configured.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@annobio.org}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      PROMPT_STUDIO_REAP_INTERVAL_SEC: ${PROMPT_STUDIO_REAP_INTERVAL_SEC:-300}
      # Platform-paid model configuration stays in Hub, never in user workspace containers.
      ANNOBIO_HOSTED_API_KEY: ${ANNOBIO_HOSTED_API_KEY:-}
      ANNOBIO_HOSTED_API_BASE: ${ANNOBIO_HOSTED_API_BASE:-}
      ANNOBIO_HOSTED_GENERATE_MODEL: ${ANNOBIO_HOSTED_GENERATE_MODEL:-}
      ANNOBIO_HOSTED_OPTIMIZE_MODEL: ${ANNOBIO_HOSTED_OPTIMIZE_MODEL:-}
      ANNOBIO_HOSTED_AGENT_MODEL: ${ANNOBIO_HOSTED_AGENT_MODEL:-}
      ANNOBIO_HOSTED_OPENROUTER_API_KEY: ${ANNOBIO_HOSTED_OPENROUTER_API_KEY:-}
      ANNOBIO_HOSTED_OPENAI_API_KEY: ${ANNOBIO_HOSTED_OPENAI_API_KEY:-}
      ANNOBIO_HOSTED_ANTHROPIC_API_KEY: ${ANNOBIO_HOSTED_ANTHROPIC_API_KEY:-}
      ANNOBIO_HOSTED_GEMINI_API_KEY: ${ANNOBIO_HOSTED_GEMINI_API_KEY:-}
      ANNOBIO_HOSTED_BEDROCK_API_KEY: ${ANNOBIO_HOSTED_BEDROCK_API_KEY:-}
      ANNOBIO_HOSTED_DAILY_TOKENS: ${ANNOBIO_HOSTED_DAILY_TOKENS:-50000}
      ANNOBIO_HOSTED_MAX_OUTPUT_TOKENS: ${ANNOBIO_HOSTED_MAX_OUTPUT_TOKENS:-8192}
      ANNOBIO_HOSTED_TOKENIZER_MODEL: ${ANNOBIO_HOSTED_TOKENIZER_MODEL:-}
    volumes:
      - hub-data:/app/hub/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./app/dist:/app/frontend-dist:ro
      # Brand logos, served at /images/* (hub/main.py looks for them next to the hub/ directory).
      - ./images:/app/images:ro
    networks:
      - prompt-studio-net

networks:
  prompt-studio-net:
    # External, not compose-managed: hub/containers.py also joins per-user backend containers to
    # this network directly via the Docker SDK (outside compose's lifecycle), so it has to
    # outlive `docker compose down`. Create it once with `docker network create prompt-studio-net`.
    name: prompt-studio-net
    external: true

volumes:
  hub-data:
  caddy-data:
  caddy-config:
