<style>
{{SHARED_CSS}}

  .page-outer { max-width: 960px; margin: 40px auto 72px; padding: 0 24px; }
  /* Narrower pages (Profile) don't stretch their content to the same 960px as a data-table or
     multi-card page — same panel, just sized to what's actually in it instead of leaving a wide
     empty margin down one side. */
  .page-outer--narrow { max-width: 620px; }
  /* Sits on the canvas-grid backdrop (see body.canvas-grid below) — same surface as the app's
     own .modal-panel (--bg-bar, 1px border, square corners, no shadow), so the grid stays
     visible around it but text reads against a flat panel instead of fighting the grid lines. */
  .page-wrap {
    padding: 40px 40px 56px;
  }
  .page-wrap h1 { font-size: 28px; letter-spacing: -0.01em; margin: 0 0 8px; }
  .page-sub { color: var(--text-muted); font-size: 15px; margin: 0 0 32px; }
