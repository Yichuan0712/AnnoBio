<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · AnnoBio</title>
<link rel="icon" href="/images/logo.png">
<style>
{{SHARED_CSS}}

  /* Match the User Guide's outer text panel so the main Hub pages share one content width. */
  .page-outer { max-width: 1180px; margin: 40px auto 72px; padding: 0 24px; }
  /* Narrower utility pages don't stretch their content to the same width as a data-table or
     multi-card page — same panel, just sized to what's actually in it instead of leaving a wide
     empty margin down one side. */
  .page-outer--narrow { max-width: 620px; }
  /* Sits on the canvas-grid backdrop (see body.canvas-grid below) — same surface as the app's
     own .modal-panel (--bg-bar, 1px border, square corners, no shadow), so the grid stays
     visible around it but text reads against a flat panel instead of fighting the grid lines. */
  .page-wrap {
    padding: 40px 40px 56px;
  }
  .page-wrap h1 { font-size: 28px; letter-spacing: -0.01em; margin: 0 0 8px; }
  .page-sub { color: var(--text-muted); font-size: 15px; margin: 0 0 32px; }

{{EXTRA_CSS}}
</style>
</head>
<body class="canvas-grid">

{{NAV}}

<div class="page-outer {{OUTER_CLASS}}">
<div class="page-wrap hub-panel">
{{BODY}}
</div>
</div>

<footer class="site-footer">
  &copy; 2026 <a href="https://digbio.github.io">Digital Biology Lab</a>'s AnnoBio
</footer>

</body>
</html>
