<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Guide · AnnoBio</title>
<link rel="icon" href="/images/logo.png">
<style>
{{SHARED_CSS}}

  body.docs-body { background-color: var(--bg); }

  /* Sits on the canvas-grid backdrop like every other Hub page's .hub-panel — the grid stays
     visible around it, but body text reads against a flat panel instead of fighting the grid
     lines underneath it. */
  .docs-outer { max-width: 1180px; margin: 32px auto 72px; padding: 0 24px; }

  .docs-shell {
    display: flex;
    align-items: flex-start;
    gap: 40px;
    padding: 40px;
  }

  .docs-sidebar {
    position: sticky;
    top: 24px;
    width: 220px;
    flex: 0 0 220px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
  }

  .docs-sidebar-heading {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 0 0 10px;
  }

  .docs-toc { list-style: none; margin: 0; padding: 0; }
  .docs-toc li { margin: 0; }
  .docs-toc li.docs-toc-group {
    margin: 20px 0 6px;
    padding: 0 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  .docs-toc li.docs-toc-group:first-child { margin-top: 0; }
  .docs-toc a {
    display: block;
    padding: 6px 10px;
    margin: 1px 0;
    border-radius: var(--control-radius, 3px);
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    line-height: 1.4;
  }
  .docs-toc a:hover { background: var(--hover); color: var(--text); }
  .docs-toc a.docs-toc-active { background: var(--bg-bar); color: var(--primary-btn-text, #2563eb); font-weight: 600; }

  .docs-main { flex: 1 1 auto; min-width: 0; }

  .docs-hero-title { font-size: 28px; letter-spacing: -0.01em; margin: 0 0 8px; }
  .docs-hero-subtitle { color: var(--text-muted); font-size: 15px; margin: 0 0 36px; max-width: 640px; }

  .docs-chapter { margin-bottom: 44px; }
  .docs-chapter-title {
    font-size: 20px;
    margin: 0 0 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .docs-article { max-width: 720px; }
  .docs-article h3 { font-size: 15px; margin: 22px 0 8px; }
  .docs-article p { color: var(--text); font-size: 14.5px; line-height: 1.65; margin: 0 0 12px; }
  .docs-article ul, .docs-article ol { margin: 0 0 14px; padding-left: 22px; }
  .docs-article li { font-size: 14.5px; line-height: 1.6; margin-bottom: 4px; }
  .docs-article a { color: var(--primary-btn-text, #2563eb); }
  .docs-article strong { font-weight: 600; }
  .docs-article code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.92em;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
  }
  .docs-example, .docs-request {
    margin: 16px 0 20px;
    padding: 16px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 13px;
    line-height: 1.65;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .docs-request { border-left: 3px solid var(--accent); font-size: 14px; }
  .docs-recommendation {
    margin: 18px 0 22px;
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    background: rgba(37, 99, 235, 0.06);
  }
  .docs-recommendation-label {
    display: block;
    margin-bottom: 7px;
    color: var(--accent);
    font-size: 11px;
    font-weight: 750;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .docs-recommendation p:last-child { margin-bottom: 0; }
  .docs-flow { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 20px 0; }
  .docs-flow span { padding: 12px 18px; border: 1px solid var(--border); background: var(--bg); font-size: 14px; text-align: center; }
  .docs-flow small { color: var(--text-muted); }
  .docs-flow b { color: var(--accent); }
  .docs-capabilities td:first-child { min-width: 110px; font-weight: 600; }

  .docs-table-wrap { overflow-x: auto; margin: 0 0 18px; }
  .docs-article table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--bg); border: 1px solid var(--border); }
  .docs-article th, .docs-article td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .docs-article th { color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; background: var(--bg-bar); }
  .docs-article tr:last-child td { border-bottom: none; }

  .docs-figure {
    margin: 0 0 22px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: var(--control-radius, 3px);
    overflow: hidden;
  }
  .docs-figure img { display: block; max-width: 100%; width: auto; height: auto; margin: 0 auto; }
  .docs-figure > a { display: block; cursor: zoom-in; }
  .docs-figure figcaption {
    padding: 8px 12px;
    font-size: 12.5px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    background: var(--bg-bar);
  }

  @media (max-width: 860px) {
    .docs-outer { padding: 0 16px; }
    .docs-shell { flex-direction: column; padding: 24px; gap: 24px; }
    .docs-sidebar { position: static; width: 100%; flex: none; max-height: none; }
    .docs-toc { display: flex; flex-wrap: wrap; gap: 4px; }
    .docs-toc a { padding: 5px 9px; }
    .docs-toc li.docs-toc-group { flex-basis: 100%; padding-left: 9px; }
  }
  @media (max-width: 480px) {
    .docs-outer { padding: 0 8px; margin-top: 16px; }
    .docs-shell { padding: 18px 14px; }
    .docs-article th, .docs-article td { padding: 8px; }
  }
</style>
</head>
<body class="canvas-grid docs-body">

{{NAV}}

<div class="docs-outer">
  <div class="docs-shell hub-panel">
    <aside class="docs-sidebar">
      <div class="docs-sidebar-heading">Contents</div>
      <ul class="docs-toc">
{{TOC_ITEMS}}
      </ul>
    </aside>
    <main class="docs-main">
      <h1 class="docs-hero-title">User Guide</h1>
      <p class="docs-hero-subtitle">Build a biomedical annotation pipeline, evaluate and improve its prompts, and use the Agent Assistant to help with each task.</p>
{{CHAPTERS}}
    </main>
  </div>
</div>

<footer class="site-footer">
  &copy; 2026 <a href="https://digbio.github.io">Digital Biology Lab</a>'s AnnoBio
</footer>

</body>
</html>
