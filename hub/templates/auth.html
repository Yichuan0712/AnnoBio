<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnnoBio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%232563eb%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%222%22%20y%3D%228.5%22%20width%3D%227%22%20height%3D%227%22%20rx%3D%221.5%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%222%22%20width%3D%227%22%20height%3D%227%22%20rx%3D%221.5%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2215%22%20width%3D%227%22%20height%3D%227%22%20rx%3D%221.5%22%2F%3E%3Cpath%20d%3D%22M9%2012v-3a2%202%200%200%201%202-2h3%22%2F%3E%3Cpath%20d%3D%22M9%2012v3a2%202%200%200%200%202%202h3%22%2F%3E%3C%2Fsvg%3E">
<style>
{{SHARED_CSS}}

  a.link { color: var(--accent); text-decoration: none; }
  a.link:hover { text-decoration: underline; }

  .auth-wrap {
    display: flex;
    justify-content: center;
    padding: 64px 24px;
    min-height: calc(100vh - 65px);
    align-items: center;
  }
  .auth-card {
    width: 100%;
    max-width: 360px;
    padding: 32px 28px;
  }
  .auth-card h1 { font-size: 21px; margin: 0 0 22px; letter-spacing: -0.01em; }
  .field { margin-bottom: 14px; }
  /* Same shape as the app's .dataset-meta-input (app/src/modals.css): sits on --bg (contrast
     against the --bg-bar panel around it), 3px corners, no custom focus ring — the app doesn't
     draw one either, so inputs just get the browser's default focus outline. */
  .field input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: var(--control-radius);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
  }
  .error {
    background: rgba(200, 0, 0, 0.08);
    color: #b00020;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: var(--control-radius);
    margin-bottom: 14px;
  }
  /* Same shape/colors as the app's .btn-primary (see shared.css) — just full-width for a form. */
  .btn-submit {
    width: 100%;
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    color: var(--accent);
    background: rgba(37, 99, 235, 0.22);
    border: 1px solid var(--accent);
    border-radius: var(--control-radius);
    cursor: pointer;
    transition: filter 0.15s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .btn-submit:hover { background: var(--hover); border-color: var(--accent); color: var(--accent); }
  .auth-footer { text-align: center; font-size: 13px; color: var(--text-muted); margin: 18px 0 0; }
</style>
</head>
<body>

{{NAV}}

<div class="auth-wrap canvas-grid">
  <div class="auth-card hub-panel">
    <h1>{{HEADING}}</h1>
    {{ERROR}}
    <form method="post" action="{{FORM_ACTION}}">
      <div class="field"><input name="email" type="email" placeholder="Email" required></div>
      <div class="field"><input name="password" type="password" placeholder="{{PASSWORD_PLACEHOLDER}}" required {{PASSWORD_MINLENGTH}}></div>
      <button type="submit" class="btn-submit">{{SUBMIT_LABEL}}</button>
    </form>
    <p class="auth-footer">{{FOOTER_LINK}}</p>
  </div>
</div>

</body>
</html>
