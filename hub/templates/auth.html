<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnnoBio</title>
<link rel="icon" href="/images/logo.png">
<style>
{{SHARED_CSS}}

  a.link { color: var(--accent); text-decoration: none; }
  a.link:hover { text-decoration: underline; }

  .auth-wrap {
    display: flex;
    justify-content: center;
    padding: 64px 24px;
    min-height: calc(100vh - 65px);
    align-items: center;
  }
  .auth-card {
    width: 100%;
    max-width: 360px;
    padding: 32px 28px;
    /* Panel surface, same as the app's bars and modals (--bg-bar, #e8eaee). */
    background: var(--bg-bar);
  }
  .auth-card h1 { font-size: 21px; margin: 0 0 22px; letter-spacing: -0.01em; }
  .field { margin-bottom: 14px; }
  /* Same shape as the app's .dataset-meta-input (app/src/modals.css): sits on --bg (contrast
     against the --bg-bar panel around it), 3px corners, no custom focus ring — the app doesn't
     draw one either, so inputs just get the browser's default focus outline. */
  .field input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: var(--control-radius);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
  }
  /* Chrome paints autofilled fields its own pale blue, which sat on top of --bg and matched
     the old tinted submit button. Keep the field on the same gray as an empty input. */
  .field input:-webkit-autofill,
  .field input:-webkit-autofill:hover,
  .field input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--text) !important;
    caret-color: var(--text);
    box-shadow: 0 0 0 1000px var(--bg) inset !important;
    border: 1px solid var(--border);
    transition: background-color 9999s ease-out;
  }
  .error {
    background: rgba(200, 0, 0, 0.08);
    color: #b00020;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: var(--control-radius);
    margin-bottom: 14px;
  }
  /* Full-width form control; color comes from .btn-primary, same as Sign up. */
  .btn-submit { width: 100%; }
  .auth-footer { text-align: center; font-size: 13px; color: var(--text-muted); margin: 18px 0 0; }
</style>
</head>
<body>

{{NAV}}

<div class="auth-wrap canvas-grid">
  <div class="auth-card hub-panel">
    <h1>{{HEADING}}</h1>
    {{ERROR}}
    <form method="post" action="{{FORM_ACTION}}">
      <div class="field"><input name="email" type="email" placeholder="Email" required></div>
      {{EXTRA_FIELDS}}
      <div class="field"><input name="password" type="password" placeholder="{{PASSWORD_PLACEHOLDER}}" required {{PASSWORD_MINLENGTH}}></div>
      <button type="submit" class="btn btn-primary btn-submit">{{SUBMIT_LABEL}}</button>
    </form>
    <p class="auth-footer">{{FOOTER_LINK}}</p>
  </div>
</div>

</body>
</html>
